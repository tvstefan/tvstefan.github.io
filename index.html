<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaSTEM26</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #ffffff;
      --accent: #036269;
      --text: #036269;
      --muted: #a7b6ca;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 110% 100%, #036269 0%, transparent 35%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
    }


    .slideshow {
      width: 100%;
      max-width: 900px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vh, 18px);
    }

    .logo-container {
      height: clamp(45px, 10vh, 85px);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo {
      max-width: min(200px, 60vw);
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .picture-frame {
      position: relative;
      width: min(77%, 900px, 110vh);
      aspect-ratio: 4 / 3;
      height: auto;
      flex: 0 1 auto;
      min-height: 0;
      background: #10233a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 22px 65px rgba(0, 0, 0, 0.35);
    }

    .slide-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .caption {
      flex-shrink: 0;
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(16px, 2.5vw, 28px);
      font-weight: 600;
      padding: 0 10px;
    }

    .indicators {
      flex-shrink: 0;
    }

    .progress-track {
      flex-shrink: 0;
    }


    .slide-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }


    .slide-image.fade {
      opacity: 0;
    }

    /* BOTTOM CAPTION */

    .caption {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 600;
      letter-spacing: 0.2px;
      padding: 0 10px;
    }

    /* SLIDE INDICATORS */

    .indicators {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
      padding-top: 2px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #62758f;
      transition: background 0.3s, transform 0.3s;
    }

    .dot.active {
      background: var(--accent);
      transform: scale(1.35);
    }

    /* PROGRESS BAR */

    .progress-track {
      width: 180px;
      height: 3px;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.13);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .slideshow {
        gap: 17px;
      }

      .logo-container {
        height: 75px;
      }

      .logo {
        max-height: 75px;
        max-width: 190px;
      }

      .picture-frame {
        border-radius: 12px;
        max-height: none;
      }

      .caption {
        min-height: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .slide-image,
      .dot {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="slideshow">

    <!-- LOGO: replace this URL with your PNG logo -->
    <div class="logo-container">
      <img class="logo" src="https://i.ibb.co/MD7kN5Jq/ra-STEM-26-wht.png" alt="Logo">
    </div>

    <!-- MAIN 4:3 IMAGE -->
    <div class="picture-frame">
      <img class="slide-image" id="slideImage" src="" alt="Slideshow picture">
    </div>

    <!-- TEXT BELOW THE PICTURE -->
    <div class="caption" id="caption"></div>

    <!-- FIVE SLIDE INDICATORS -->
    <div class="indicators" id="indicators">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <!-- FOUR-SECOND PROGRESS BAR -->
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </main>

  <script>
    /* ==================================================
       EDIT ONLY THIS SECTION
       ================================================== */

    const LOGO_URL = "https://i.ibb.co/MD7kN5Jq/ra-STEM-26-wht.png";

    const SLIDE_DURATION = 4000; // 4 seconds per slide

    const slides = [
      {
        caption: "Marko Kokol o umetni inteligenci 🤖",
        images: [
          "https://jozefstefan.org/wp_2020/wp-content/uploads/2026/10/IMG_1191-2048x1536.jpeg",
          "https://jozefstefan.org/wp_2020/wp-content/uploads/2026/10/IMG_1233-2048x1536.jpeg",
          "https://jozefstefan.org/wp_2020/wp-content/uploads/2026/10/IMG_1253-2048x1536.jpeg"
        ]
      },
      {
        caption: "Obiski učencev osnovnih in srednjih šol 🚸",
        images: [
          "https://jozefstefan.org/wp_2020/wp-content/uploads/2026/10/IMG_1447-2048x1536.jpeg",
          "https://jozefstefan.org/wp_2020/wp-content/uploads/2026/10/IMG_1283-2048x1536.jpeg",
          "https://jozefstefan.org/wp_2020/wp-content/uploads/2026/10/IMG_1481-2048x1536.jpeg"
        ]
      },
      {
        caption: "Tehniško-znanstveni sejem 🔭",
        images: [
          "https://jozefstefan.org/wp_2020/wp-content/uploads/2026/10/IMG_1775-2048x1536.jpeg",
          "https://jozefstefan.org/wp_2020/wp-content/uploads/2026/10/IMG_1702-2048x1536.jpeg",
          "https://jozefstefan.org/wp_2020/wp-content/uploads/2026/10/IMG_1737-2048x1536.jpeg"
        ]
      },
      {
        caption: "Hvala za pomoč in sodelovanje ❤️",
        images: [
          "https://i.ibb.co/FLGLJSsx/IMG-9770-Large.jpg",
          "https://i.ibb.co/FLGLJSsx/IMG-9770-Large.jpg",
          "https://i.ibb.co/FLGLJSsx/IMG-9770-Large.jpg",
        ]
      },
    ];

    /* ==================================================
       SLIDESHOW ENGINE — NO NEED TO EDIT BELOW
       ================================================== */


    const imageElement = document.getElementById("slideImage");
    const captionElement = document.getElementById("caption");
    const progressBar = document.getElementById("progressBar");
    const dots = document.querySelectorAll(".dot");
    const logoElement = document.querySelector(".logo");

    logoElement.src = LOGO_URL;

    // Randomly select one image from each group, once per page load.
    const selectedSlides = slides.map(slide => ({
      image: slide.images[
        Math.floor(Math.random() * slide.images.length)
      ],
      caption: slide.caption
    }));

    let currentSlide = 0;
    let slideStartTime = 0;
    let animationFrame;

    function showSlide(index) {
      currentSlide = index;

      imageElement.src = selectedSlides[index].image;
      captionElement.textContent = selectedSlides[index].caption;

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
      });

      slideStartTime = performance.now();
    }

    function updateProgress(now) {
      const elapsed = now - slideStartTime;
      const progress = Math.min(elapsed / SLIDE_DURATION, 1);

      progressBar.style.width = `${progress * 100}%`;

      if (elapsed >= SLIDE_DURATION) {
        // Always advance in order: 1 → 2 → 3 → 4 → 5 → 1
        const nextSlide = (currentSlide + 1) % selectedSlides.length;
        showSlide(nextSlide);
      }

      animationFrame = requestAnimationFrame(updateProgress);
    }

    // Start with slide 1.
    showSlide(0);
    animationFrame = requestAnimationFrame(updateProgress);

  </script>

</body>

</html>
